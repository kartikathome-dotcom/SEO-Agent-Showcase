<svg xmlns="http://www.w3.org/2000/svg" width="440" height="810" viewBox="0 0 440 810" role="img" aria-labelledby="title"><title id="title">Job commits and retry outcomes</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="440" height="810" fill="#f8fafc"/>
<path d="M295 84 V130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M170 162 H145" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="104" y="112" font-family="Arial,sans-serif" font-size="16" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5">Completed</text>
<path d="M295 194 V275" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="337" y="234.5" font-family="Arial,sans-serif" font-size="16" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5">New or retry</text>
<path d="M295 339 V440" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="337" y="389.5" font-family="Arial,sans-serif" font-size="16" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5">Success</text>
<path d="M295 504 V555" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M170 307 H77 V555" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="111" y="420" font-family="Arial,sans-serif" font-size="16" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5">Failure</text>
<path d="M10 587 H4 V220 H295 V194" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="88" y="240" font-family="Arial,sans-serif" font-size="16" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5">Transient retry</text>
<path d="M77 619 V700" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="80" y="660" font-family="Arial,sans-serif" font-size="16" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5">Permanent</text>
<rect x="170" y="20" width="250" height="64" rx="9" fill="#e0f2fe" stroke="#475569" stroke-width="1.5"/>
<text x="295.0" y="58.0" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">Signed dispatch</text>
<rect x="170" y="130" width="250" height="64" rx="9" fill="#e0f2fe" stroke="#475569" stroke-width="1.5"/>
<text x="295.0" y="157.0" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">Verify and</text>
<text x="295.0" y="179.0" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">claim job</text>
<rect x="10" y="130" width="135" height="64" rx="9" fill="#e0f2fe" stroke="#475569" stroke-width="1.5"/>
<text x="77.5" y="157.0" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">Stored</text>
<text x="77.5" y="179.0" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">result</text>
<rect x="170" y="275" width="250" height="64" rx="9" fill="#e0f2fe" stroke="#475569" stroke-width="1.5"/>
<text x="295.0" y="302.0" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">Reserve budget</text>
<text x="295.0" y="324.0" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">and execute</text>
<rect x="170" y="440" width="250" height="64" rx="9" fill="#e0f2fe" stroke="#475569" stroke-width="1.5"/>
<text x="295.0" y="467.0" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">Persist result</text>
<text x="295.0" y="489.0" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">and settle usage</text>
<rect x="170" y="555" width="250" height="64" rx="9" fill="#e0f2fe" stroke="#475569" stroke-width="1.5"/>
<text x="295.0" y="593.0" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">Commit outcome</text>
<rect x="10" y="555" width="135" height="64" rx="9" fill="#fff1f2" stroke="#475569" stroke-width="1.5"/>
<text x="77.5" y="582.0" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">Record</text>
<text x="77.5" y="604.0" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">failure</text>
<rect x="10" y="700" width="135" height="64" rx="9" fill="#fff1f2" stroke="#475569" stroke-width="1.5"/>
<text x="77.5" y="727.0" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">Abort retry</text>
<text x="77.5" y="749.0" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">chain</text>
</svg>
